name: Release

# Push a tag such as v0.1.0 to build and publish a release. install.ps1 downloads its assets.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test tests/TreeVisualizer.Tests -c Release
      - name: Build release assets
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./publish.ps1 -Runtime win-x64 -Version $version -Zip
          ./publish.ps1 -Runtime win-arm64 -Version $version -Zip
          Set-Location dist
          Get-ChildItem TreeVisualizer-*.zip |
            ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } |
            Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create '${{ github.ref_name }}'
          dist/TreeVisualizer-win-x64.zip dist/TreeVisualizer-win-arm64.zip dist/SHA256SUMS.txt
          --title 'Tree Visualizer ${{ github.ref_name }}' --generate-notes
